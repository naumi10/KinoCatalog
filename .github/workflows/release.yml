name: Release

on:
  push:
    tags:
      - 'v*' # Triggers the workflow when you push a tag like v1.0.0

jobs:
  build-and-release:
    name: Build Asset (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: KinoCatalog.exe
            release_archive: KinoCatalog-windows-x64.zip
            installer_asset: KinoCatalog-windows-x64-setup.exe
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: KinoCatalog
            release_archive: KinoCatalog-linux-x64.tar.gz



    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux GUI Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Windows Asset
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../${{ matrix.release_archive }} ${{ matrix.artifact_name }}

      - name: Build Windows Installer
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # Tags look like v1.2.3; Inno Setup uses just the numeric version.
          $version = $env:RELEASE_TAG -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$') {
            throw "Unexpected release tag '$env:RELEASE_TAG' (version '$version')."
          }

          # Inno Setup 6 is preinstalled on GitHub's Windows runners.
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            throw "Inno Setup 6 compiler (ISCC.exe) was not found."
          }

          $outputDir = Join-Path $env:RUNNER_TEMP 'KinoCatalog-installer'
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null

          & $iscc "/DAppVersion=`"$version`"" "/O$outputDir" 'installer\windows\KinoCatalog.iss'
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          Move-Item (Join-Path $outputDir 'KinoCatalog-windows-x64-setup.exe') '${{ matrix.installer_asset }}'

      - name: Package Linux Asset
        if: matrix.os == 'ubuntu-latest'
        run: |
          # Stage the release files under a single directory in the archive.
          # Keep the staging directory outside target/release, because the
          # compiled binary itself is named "KinoCatalog" there.
          package_dir="$RUNNER_TEMP/KinoCatalog"
          rm -rf "$package_dir"
          mkdir -p "$package_dir"
          cp "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" "$package_dir/"
          cp assets/KinoCatalog.png install.sh "$package_dir/"

          # Ensure the install script has execution permissions before archiving
          chmod +x "$package_dir/install.sh"

          tar -czf "${{ matrix.release_archive }}" -C "$RUNNER_TEMP" KinoCatalog

      - name: Upload Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.release_archive }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Installer to GitHub Release
        if: matrix.os == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.installer_asset }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
